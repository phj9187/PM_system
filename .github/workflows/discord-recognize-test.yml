name: Discord recognize test

# Bot이 볼 수 있는 텍스트 채널의 최근 메시지로 Gemini 인식을 시험하고,
# 찾은 후보를 같은 Discord 채널에 올린다. 공개 실행 기록에는 개수만 남긴다.
# Gemini 일시 오류(429·5xx)는 recognize.py가 다시 시도하고, 그래도 안 되면 다른 Flash 모델로 넘어간다.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-hgnbgy]
    paths: ['.github/workflows/discord-recognize-test.yml']

permissions:
  contents: read

jobs:
  recognize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 인식 시험
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "DISCORD_BOT_TOKEN 또는 GEMINI_API_KEY 보안 비밀이 없습니다. 건너뜁니다."
            exit 0
          fi
          python -m integrations.discord.bot recognize-test
