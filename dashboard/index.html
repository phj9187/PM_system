<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b303d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>ROHANG · 조직 운영</title>
<style>
:root{--ink:#1b303d;--muted:#617584;--line:#dce5eb;--blue:#366af0;--teal:#218a7a;--amber:#a76313;--red:#c34840}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:15px/1.6 system-ui,'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;padding:8px 14px;color:var(--ink)}button:hover{background:#edf2f7}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #91afff;outline-offset:2px}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#345364}.danger{color:var(--red)}header{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}.brand{font-weight:800;letter-spacing:2px;color:var(--teal)}.actions,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.shell{padding:24px 28px 0}.heading{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 8px}p{margin:5px 0}.muted{color:var(--muted);font-size:13px}.pinned{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:13px;background:white;padding:18px 22px;min-width:0}.eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--teal);font-weight:700}.purpose{font-size:19px;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0 8px}.goals{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.goal{padding:4px 10px;background:#f1f5f8;font-size:13px;max-width:100%;overflow-wrap:anywhere}.attention{display:grid;grid-template-columns:1fr 1fr;gap:10px}.number{font-size:26px;font-weight:700;color:var(--amber)}.attention button{text-align:left}.notice{border:0;padding:3px 0;background:none;text-align:left;color:var(--blue);display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{padding:20px 0 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.legend{font-size:12px;color:var(--muted)}.legend span{margin-right:10px}.viewport{height:570px;overflow:auto;position:relative;touch-action:pan-x pan-y;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;cursor:grab}.viewport.dragging{cursor:grabbing;user-select:none}.world{position:relative;min-height:570px}.ruler{position:sticky;top:0;z-index:5;height:46px;background:#fffffff5;border-bottom:1px solid #e9eef3}.tick{position:absolute;top:0;height:46px;border-left:1px solid #dce5eb;padding:10px 7px;font-size:12px;color:var(--muted);white-space:nowrap}.grid{position:absolute;top:46px;bottom:0;border-left:1px solid #eef2f5;pointer-events:none}.grid.major{border-color:#dce5eb}.axis{position:absolute;height:3px;background:#d4dfe5;left:24px;right:24px}.stem{position:absolute;width:2px;opacity:.55}.task{position:absolute;width:230px;text-align:left;padding:12px 15px;border:1px solid var(--line);border-left:3px solid var(--task-color);border-radius:10px;background:white;box-shadow:0 3px 9px #1b303d06;cursor:pointer;z-index:2}.task b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task .status{font-size:11px;font-weight:700;color:var(--task-color)}.task .meta{font-size:12px;color:var(--muted);display:block}.task .note{font-size:12px;color:var(--muted);display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.duration{position:absolute;height:4px;border-radius:2px}.milestone{position:absolute;border:2px solid var(--blue);background:white;width:13px;height:13px;border-radius:50%;z-index:3}.milestone-label{position:absolute;font-size:11px;color:var(--muted);white-space:nowrap}.today{position:absolute;width:2px;background:var(--blue);top:46px;bottom:14px;pointer-events:none;z-index:1}.today-label{position:absolute;background:var(--blue);color:white;font-size:11px;padding:3px 7px;border-radius:5px;top:4px;z-index:6;white-space:nowrap}.empty{position:absolute;top:100px;left:50px;max-width:420px;padding:20px;color:var(--muted)}footer{padding:12px 28px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:15px;width:min(600px,94vw);max-height:90vh;padding:24px;color:var(--ink)}dialog::backdrop{background:#14273470}form{display:grid;gap:12px}label{display:grid;gap:4px;font-size:13px}input,textarea,select{border:1px solid #cbd7df;border-radius:7px;padding:9px 11px;width:100%;background:white;color:var(--ink)}textarea{resize:vertical;min-height:74px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.error{color:var(--red);white-space:pre-wrap}.list-item{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px}.list-item button{max-width:100%;overflow-wrap:anywhere;text-align:left}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;background:var(--ink);color:white;border-radius:9px;z-index:20;max-width:90vw}.hidden{display:none!important}.detail-info{background:#f3f6fa;padding:8px 12px;border-radius:6px;font-size:12px}.tabs{display:flex;gap:4px;align-items:center}.tab{border:0;background:none;padding:8px 12px;color:var(--muted);border-radius:8px;font-weight:600}.tab[aria-current=page]{background:#e8f2f0;color:var(--teal)}.chat-link{font-size:13px;color:var(--muted);padding:6px 10px;border:1px dashed var(--line);border-radius:8px;text-decoration:none}a.chat-link{color:var(--blue);border-style:solid}.view{min-height:calc(100vh - 64px)}.mission{max-width:860px;margin:0 auto;padding:24px 28px 60px}.mission-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}.mission-head label{min-width:200px}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.counts .panel{padding:12px 14px}.counts .number{font-size:22px}.group{margin-bottom:20px}.group h2{font-size:15px;color:var(--muted)}.mission-item{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-left:3px solid var(--task-color);border-radius:10px;background:white}.mission-item b{display:block;overflow-wrap:anywhere}.mission-item .meta{font-size:12px;color:var(--muted)}@media(max-width:760px){.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}.tab{flex:1}body{padding-bottom:64px}.mission{padding:18px 14px 40px}.counts{grid-template-columns:1fr 1fr}header{height:auto;min-height:64px;padding:12px 16px;flex-wrap:wrap}.shell{padding:18px 14px 0}.pinned{grid-template-columns:1fr}.panel{padding:15px}.heading{align-items:flex-start}h1{font-size:22px}.viewport{height:520px}.toolbar .row{gap:5px}.toolbar button{padding:6px 10px}.cols{grid-template-columns:1fr}footer{padding:12px 14px;flex-wrap:wrap}.legend{display:none}}
</style></head><body>
<header><div class="row"><span class="brand">ROHANG</span><nav class="tabs" aria-label="앱 화면"><button class="tab" data-view="dashboard" aria-current="page">대시보드</button><button class="tab" data-view="missions">내 임무</button></nav><span id="chatLink" class="chat-link" title="팀 채팅은 Discord에서 합니다. 연결 설정은 이후 단계에서 추가됩니다.">팀 채팅 · Discord (연결 전)</span></div><nav class="actions" id="dashboardActions"><button id="reload">새로고침</button><button id="export">백업 저장</button><button id="import">백업 불러오기</button><input type="file" id="file" accept="application/json,.json" hidden></nav></header>
<div id="dashboardView" class="view"><main class="shell"><section class="heading"><div><div class="eyebrow">PROJECT TIMELINE</div><h1 id="projectTitle">불러오는 중…</h1><div id="saved" class="muted" role="status"></div></div><button id="editProject">프로젝트 편집</button></section>
<section class="pinned" aria-label="확대·이동과 무관한 핵심 정보"><article class="panel"><div class="eyebrow">목표와 성공 조건</div><div id="purpose" class="purpose"></div><p id="success" class="muted"></p><p id="period" class="muted"></p><div class="row"><h2 style="margin:10px 0 0">세부 목표</h2><button id="addGoal">목표 추가</button></div><div id="goals" class="goals"></div></article><article class="panel"><h2>지금 확인할 정보</h2><div class="attention"><button id="openDecisions"><span class="muted">결정 대기</span><div id="decisionCount" class="number">0</div></button><button id="showIssues"><span class="muted">지연·차단 작업</span><div id="issueCount" class="number">0</div></button></div><div id="alerts"></div><button id="addDecision" class="notice">결정 요청 추가</button></article></section>
<section class="toolbar"><div><strong id="range"></strong><div class="legend"><span>청록 · 완료</span><span>파랑 · 진행 중</span><span>회색 · 예정</span><span>주황 · 차단</span></div></div><div class="row"><button id="today">오늘</button><button id="fit">전체 맞춤</button><button id="zoomOut" aria-label="시간축 축소">−</button><output id="zoom">100%</output><button id="zoomIn" aria-label="시간축 확대">+</button><button id="addTask" class="primary">작업 추가</button></div></section></main>
<section id="viewport" class="viewport" aria-label="프로젝트 타임라인. 가로 스크롤로 이동하고 확대·축소 버튼으로 날짜 간격을 조절하세요." tabindex="0"><div id="world" class="world"><div id="ruler" class="ruler"></div></div></section>
<footer><span>빈 공간 드래그 · 가로 스크롤로 이동 / Ctrl + 휠로 확대·축소 / 작업을 눌러 편집</span><span>서버 파일에 저장 · 코랩 종료 전 백업 저장</span></footer></div>
<section id="missionView" class="view hidden" aria-label="개인별 임무 창"><div class="mission"><div class="mission-head"><div><div class="eyebrow">MY MISSIONS</div><h1>개인별 임무</h1><p class="muted">담당자로 지정된 작업을 모아 봅니다. 로그인 기능이 생기기 전까지는 이름을 직접 고릅니다.</p></div><label>담당자<select id="member"></select></label></div><div class="counts"><div class="panel"><span class="muted">지연·차단</span><div id="mIssue" class="number">0</div></div><div class="panel"><span class="muted">진행 중</span><div id="mDoing" class="number">0</div></div><div class="panel"><span class="muted">예정</span><div id="mTodo" class="number">0</div></div><div class="panel"><span class="muted">완료</span><div id="mDone" class="number">0</div></div></div><div id="missionList"></div></div></section>
<dialog id="editor"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><div id="error" class="error" role="alert"></div><div class="form-actions"><button id="remove" class="danger" type="button">삭제</button><div class="row"><button id="cancel" type="button">취소</button><button class="primary" type="submit">저장</button></div></div></form></dialog>
<dialog id="listing"><h2 id="listTitle"></h2><div id="listItems"></div><button id="closeList" style="margin-top:18px">닫기</button></dialog><div id="toast" class="toast hidden" role="status"></div>
<script src=app.js></script></body></html>
